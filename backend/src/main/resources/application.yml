spring:
  application:
    name: karvya-store

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/karvya}
    username: ${SPRING_DATASOURCE_USERNAME:karvya}
    password: ${SPRING_DATASOURCE_PASSWORD:karvya}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
      table-name: SPRING_SESSION
    timeout: 12h

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 32MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        name: KARVYA_SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # An unreachable SMTP server must not mark the application unhealthy.
    # Orders are written before any mail is attempted and failed sends are
    # retried from the outbox, so mail availability is not a liveness concern -
    # letting it flip the health endpoint would cause pointless restarts.
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${APP_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${APP_OPENAPI_ENABLED:true}
    path: /swagger-ui.html

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  storage-dir: ${APP_STORAGE_DIR:./media}
  mail-from: ${MAIL_FROM:orders@rainbowbooks.local}
  admin-notification-email: ${APP_ADMIN_NOTIFICATION_EMAIL:owner@example.com}
  whats-app-number: ${APP_WHATSAPP_NUMBER:}
  bootstrap-admin:
    username: ${APP_ADMIN_USERNAME:admin}
    email: ${APP_ADMIN_EMAIL:admin@example.com}
    password: ${APP_ADMIN_PASSWORD:}
  security:
    login-max-attempts: 5
    lockout-duration: PT15M
    password-reset-ttl: PT1H
    registrations-per-hour-per-ip: 5
    login-attempts-per-window-per-ip: 20
    password-resets-per-hour-per-ip: 5
    enquiries-per-hour-per-ip: 5
  notifications:
    enabled: true
    max-attempts: 6
    batch-size: 25
    poll-interval: PT1M

logging:
  level:
    com.karvya.store: INFO
    org.springframework.security: WARN
