<!--
  Shared shell for every notification.

  Table-based with inline styles on purpose: email clients strip <style>
  blocks and have no reliable flexbox, so the layout rules that work in the
  storefront do not survive here. The palette is the same coir and terracotta
  as the site, so a confirmation looks like it came from the same place.
-->
<div th:fragment="shell(title, body)" style="margin:0;padding:0;background:#F0E7D8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="background:#F0E7D8;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px;background:#FBF7F0;border:1px solid #E0D4C0;border-radius:12px;">
          <tr>
            <td style="padding:24px 28px 8px;">
              <div style="font-family:Georgia,serif;font-size:24px;font-weight:600;color:#33322E;"
                   th:text="${storeName}">Rainbow Books</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px;">
              <div style="height:1px;background:#E0D4C0;"></div>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px 28px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#33322E;">
              <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-size:20px;font-weight:600;color:#33322E;"
                  th:text="${title}">Title</h1>
              <div th:replace="${body}">Body</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 24px;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#6B6357;">
              <div style="height:1px;background:#E0D4C0;margin-bottom:14px;"></div>
              <span th:text="|This message was sent by ${storeName}.|">Sent by the store.</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
