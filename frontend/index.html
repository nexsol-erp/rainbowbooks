<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F0E7D8" />

    <!--
      Fonts are preconnected rather than merely linked so the handshake to the
      font host overlaps with parsing instead of following it. display=swap
      means text is readable in the fallback while the webfont arrives.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap"
    />

    <title>Rainbow Books</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This shop needs JavaScript to browse the catalogue. Please enable it, or
      contact us directly to place an order.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
