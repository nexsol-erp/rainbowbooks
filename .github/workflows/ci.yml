name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant; cancel it rather than pay
# for both. The default branch is excluded so a merge always produces a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # No service container: the tests start PostgreSQL themselves through
      # Testcontainers, which keeps one definition of the database rather than
      # one here and another in AbstractIntegrationTest that could drift.
      - name: Test
        run: mvn -B verify
        working-directory: backend

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      # tsc -b runs as part of build, so a type error fails here too
      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Component tests
        run: npm test
        working-directory: frontend

  end-to-end:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The whole stack, as it actually runs. Building the images here also
      # proves the production path works, which the dev server never exercises.
      - name: Build images
        run: |
          cp .env.example .env
          # the harness runs on plain HTTP, so the session cookie cannot be
          # marked Secure or no session would survive a redirect
          echo "APP_COOKIE_SECURE=false" >> .env
          docker compose build

      - name: Start the stack
        run: |
          docker compose up -d
          # readiness, not liveness: the backend is only usable once Flyway has
          # finished and the connection pool is warm
          for i in $(seq 1 60); do
            if curl -fs http://localhost/actuator/health >/dev/null; then
              echo "stack ready after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready"; docker compose logs --tail=100; exit 1

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run end-to-end tests
        env:
          E2E_BASE_URL: http://localhost
          E2E_ADMIN_EMAIL: owner@example.com
          E2E_ADMIN_PASSWORD: change-me-at-first-login
        run: npx playwright test
        working-directory: frontend

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Publish Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Publishes what end-to-end just proved works, so the Deploy workflow (which
  # waits for this whole CI run to succeed) has something to pull. Skipped on
  # PRs: an unmerged branch has no business in the registry a production
  # deploy pulls from.
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [end-to-end]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit SHA only, not `latest` - Deploy always names an exact
      # tag (the commit it is deploying), so a floating tag would only invite
      # the two to drift apart.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
