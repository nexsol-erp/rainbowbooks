# Rainbow Books storefront: serves the built SPA, proxies the API, and serves media.
#
# One origin for everything, which is what makes the session cookie and the
# CSRF header pair work without any cross-origin configuration.

# The scheme the *customer* used, which is not always the scheme nginx saw.
#
# In production Caddy terminates TLS and forwards plain HTTP over the compose
# network, so $scheme here is "http" even though the visitor is on HTTPS.
# Passing that on makes the application generate http:// links - including the
# one in a password reset email. Prefer what the terminator said, and fall back
# to our own scheme when nothing is in front of us, which is the case locally
# and in CI.
#
# Trusting a client-supplied header is only safe because nginx is not published
# in production: docker-compose.prod.yml drops its port mapping, so the only
# thing that can reach it is Caddy.
map $http_x_forwarded_proto $client_proto {
    default   $scheme;
    "https"   https;
    "http"    http;
}

upstream backend_app {
    # No underscore in the name: it becomes the Host header if one is not set
    # explicitly, and an underscore makes that header invalid.
    server backend:8080;
    keepalive 16;
}

# Compress text; images are already compressed by the build pipeline and
# re-compressing them wastes CPU for nothing.
gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain text/css text/xml
    application/javascript application/json application/xml
    application/rss+xml image/svg+xml;

server {
    listen 80;
    # Also on IPv6. Without this the container's own health check fails while
    # the site serves perfectly from outside: wget resolves localhost to ::1,
    # finds nothing listening, and reports connection refused.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads can be large; the application caps them at 8 MB per image, so
    # this only needs to be above that plus multipart overhead.
    client_max_body_size 12m;

    # Do not advertise the version to anyone scanning for known holes.
    server_tokens off;

    # ---- health ----
    location = /healthz {
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- API ----
    location /api/ {
        include /etc/nginx/conf.d/proxy.conf;
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://backend_app;
        add_header Cache-Control "no-store" always;
    }

    location = /actuator/health {
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://backend_app;
        access_log off;
    }

    # Generated from live data by the backend, so they cannot go stale.
    location = /sitemap.xml {
        include /etc/nginx/conf.d/proxy.conf;
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://backend_app;
    }

    location = /robots.txt {
        include /etc/nginx/conf.d/proxy.conf;
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://backend_app;
    }

    # ---- media ----
    # Served straight from the shared volume; the request never reaches Java.
    # Derivatives are addressed by width and format and replaced by a new key
    # rather than overwritten, so a year is safe.
    location /media/ {
        include /etc/nginx/conf.d/security-headers.conf;
        alias /var/www/media/;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- static assets ----
    # Vite fingerprints these filenames, so a change produces a new name and a
    # long cache can never serve a stale bundle.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---- the SPA itself ----
    # index.html is never cached: it carries the references to the fingerprinted
    # bundles, so a cached copy would pin visitors to an old deployment.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
